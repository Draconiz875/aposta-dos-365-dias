<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>J.V. ❤️ Gabi | Nosso Desafio</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>


    <main class="page">

        <section class="card">


            <div class="heart">
                ♥
            </div>


            <p class="eyebrow">
                O NOSSO DESAFIO
            </p>


            <h1>
                J.V. <span>♥</span> Gabi
            </h1>


            <p class="subtitle">
                Um ano. Uma aposta. E muita força de vontade. 👀
            </p>


            <div class="divider"></div>


            <p
                class="label"
                id="statusLabel"
            >
                AINDA FALTA
            </p>


            <div class="main-counter">

                <div
                    class="number"
                    id="days"
                >
                    357
                </div>


                <div class="days-word">
                    DIAS
                </div>

            </div>


            <div class="time-grid">


                <div class="time-box">

                    <strong id="hours">
                        00
                    </strong>

                    <span>
                        HORAS
                    </span>

                </div>


                <div class="time-box">

                    <strong id="minutes">
                        00
                    </strong>

                    <span>
                        MINUTOS
                    </span>

                </div>


                <div class="time-box">

                    <strong id="seconds">
                        00
                    </strong>

                    <span>
                        SEGUNDOS
                    </span>

                </div>


            </div>


            <div class="progress-section">


                <div class="progress-info">

                    <span>
                        PROGRESSO
                    </span>

                    <span id="progressText">
                        0%
                    </span>

                </div>


                <div class="progress-track">

                    <div
                        class="progress-bar"
                        id="progressBar"
                    ></div>

                </div>


            </div>


            <div class="dates">


                <div>

                    <span>
                        COMEÇOU
                    </span>

                    <strong id="startDate">
                        29/09/2026
                    </strong>

                </div>


                <div>

                    <span>
                        TERMINA
                    </span>

                    <strong id="endDate">
                        29/09/2027
                    </strong>

                </div>


            </div>


            <p
                class="footer-message"
                id="footerMessage"
            >
                Cada segundo conta. ❤️
            </p>


        </section>


        <p class="tiny">
            feito para João & Gabi não esquecer da aposta rsrs
        </p>


    </main>


    <script src="./script.js"></script>

</body>

</html>
